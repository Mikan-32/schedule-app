<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>スケジュール</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <div>
        <p class="eyebrow" id="today-label"></p>
        <h1 class="large-title">スケジュール</h1>
      </div>
      <div class="navbar-actions">
        <button class="icon-button" id="open-settings" aria-label="登録の基準" title="登録の基準（名前・所属グループ・宛先ごとの扱い）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
        <button class="icon-button filled" id="open-sheet" aria-label="予定を追加" title="予定を追加">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>
    <nav class="segmented" role="tablist">
      <button role="tab" class="segment active" data-tab="events">予定</button>
      <button role="tab" class="segment" data-tab="pending">確認待ち<span class="badge orange" id="pending-badge" hidden></span></button>
      <button role="tab" class="segment" data-tab="notifications">通知<span class="badge" id="unread-badge" hidden></span></button>
    </nav>
  </header>

  <main id="content" class="content" aria-live="polite"></main>

  <footer class="statusbar" id="statusbar"></footer>

  <!-- 追加シート -->
  <div class="sheet-backdrop" id="sheet" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-header">
        <button class="text-button" id="close-sheet">キャンセル</button>
        <h2 id="sheet-title">予定を追加</h2>
        <span class="spacer"></span>
      </div>
      <nav class="segmented small" id="sheet-tabs">
        <button class="segment active" data-mode="analyze">メッセージを解析</button>
        <button class="segment" data-mode="manual">手動で入力</button>
      </nav>

      <form id="analyze-form" class="sheet-body">
        <div class="group">
          <textarea name="text" rows="5" placeholder="Discord などのメッセージや画像・PDF を貼り付け&#10;例: 来週水曜の15時から定例ミーティングです。場所は会議室Aで。"></textarea>
          <div class="thumbs" id="thumbs" hidden></div>
          <div class="row file-row">
            <label class="text-button">
              <input type="file" id="image-input" accept="image/*,application/pdf,.pdf" multiple hidden>画像・PDF を選択
            </label>
            <span class="secondary" id="file-names"></span>
          </div>
        </div>
        <p class="footnote" id="analyze-note"></p>
        <button class="primary-button" type="submit"><span class="label">解析する</span></button>
        <div id="analyze-jobs"></div>
      </form>

      <form id="manual-form" class="sheet-body" hidden>
        <div class="group">
          <label class="row field"><span>タイトル</span><input name="title" required placeholder="定例ミーティング"></label>
          <label class="row field"><span>日付</span><input name="date" type="date" required></label>
          <label class="row field"><span>開始</span><input name="start_time" type="time"></label>
          <label class="row field"><span>終了</span><input name="end_time" type="time"></label>
          <label class="row field"><span>場所</span><input name="location" placeholder="任意"></label>
        </div>
        <p class="footnote">開始時刻を空欄にすると終日の予定になります。</p>
        <button class="primary-button" type="submit"><span class="label">追加</span></button>
      </form>
    </section>
  </div>

  <!-- 登録の基準シート -->
  <div class="sheet-backdrop" id="settings-sheet" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="sheet-header">
        <button class="text-button" id="close-settings" type="button">キャンセル</button>
        <h2 id="settings-title">登録の基準</h2>
        <button class="text-button end" type="submit" form="settings-form">保存</button>
      </div>
      <form id="settings-form" class="sheet-body settings">
        <div class="section-label">あなた</div>
        <div class="group">
          <label class="row field"><span>名前</span><input name="names" placeholder="遥陽, はるひ" autocomplete="off"></label>
          <label class="row field"><span>所属グループ</span><input name="groups" placeholder="students-2026" autocomplete="off"></label>
        </div>
        <p class="footnote">名前はメンションや呼びかけで使われる表示名・ニックネーム、所属グループは @ロール名 やチーム名です（どちらもカンマ区切り）。</p>
        <div class="section-label">宛先ごとの扱い</div>
        <div class="group" id="audience-actions"></div>
        <p class="footnote">「確認」は確認待ちタブで追加するか選べます。「見送り」は通知タブに残り、「自分の予定として追加する」であとから登録できます。名前が出てくるメッセージは、ほかの条件より優先して自分宛てになります。</p>
      </form>
    </section>
  </div>

  <div class="drop-overlay" id="drop-overlay" hidden><div>画像・PDF をドロップして予定を読み取る</div></div>
  <div class="toast" id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
